# compose.content-lake.yaml — Content Lake ingestion and RAG services
# Part of the content-lake-app stack; loaded via include: in compose.yaml.
# Profiles: alfresco, full, demo (Alfresco ingesters + live ingester); nuxeo, full, demo (Nuxeo ingesters + live ingester);
#           all profiles (rag-service)
#
# Build approach: each service uses a local Dockerfile in dockerfiles/<service>/ that pulls
# app source via additional_context "code" (CONTENT_LAKE_GIT_CONTEXT -- remote Git URL or
# local ../content-lake-app path). This eliminates duplicate dockerfile_inline blocks while
# keeping the remote-source build capability.

services:

  # ── Alfresco ingesters ──────────────────────────────────────────────────────

  batch-ingester:
    profiles: [alfresco, full, demo]
    image: content-lake-app/batch-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/batch-ingester/Dockerfile
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/aborroy/content-lake-app.git#main}"
    environment:
      ACTIVEMQ_URL: ${CONTENT_LAKE_PERMISSION_SYNC_BROKER_URL:-tcp://activemq:61616}
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      ALFRESCO_URL: http://alfresco:8080
      ALFRESCO_INTERNAL_USERNAME: ${ALFRESCO_ADMIN_USER}
      ALFRESCO_INTERNAL_PASSWORD: ${ALFRESCO_ADMIN_PASSWORD}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_TARGET_PATH}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      CONTENT_LAKE_PERMISSION_SYNC_QUEUE_NAME: ${CONTENT_LAKE_PERMISSION_SYNC_QUEUE_NAME:-contentlake.acl.changed}
      # Overridable so the ingester can be pointed at a markdown-capable engine (see the
      # transform-extras profile below) instead of the official plaintext-only AIO.
      TRANSFORM_URL: ${TRANSFORM_URL:-http://transform-core-aio:8090}
      TRANSFORM_TIMEOUT_MS: ${TRANSFORM_TIMEOUT_MS:-300000}
      # plaintext (default) keeps today's behaviour exactly. auto/markdown ask the engine for
      # text/markdown where it advertises it, so tables survive chunking as ChunkType.TABLE.
      EXTRACTION_FORMAT: ${EXTRACTION_FORMAT:-plaintext}
      # Extra extraction services tried before transform-core-aio, most structural first. Comma
      # separated; an entry may carry a backend-kind prefix (transform:, and others as they are added).
      # Empty means only the transform service above is used.
      EXTRACTION_ENGINE_URLS: ${EXTRACTION_ENGINE_URLS:-}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      LLM_MODEL: ${LLM_MODEL:-ai/gpt-oss}
      # Local model generation runs well beyond the OpenAI client's 10s default; extend it so the
      # per-document extraction call does not abort with OpenAIIoException.
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
      INGESTION_FOLDER_1: ${INGESTION_FOLDER_1:--root-}
      # Post-discovery reconciliation sweep. The application default is false; this stack opts in
      # because the end-to-end suite asserts the delete-while-live-ingester-down case. The ratio is
      # raised from 0.10 because the test corpus is a handful of documents, where 0.10 rounds to a
      # guard that trips on a single legitimate deletion.
      INGESTION_RECONCILE_ENABLED: ${INGESTION_RECONCILE_ENABLED:-true}
      INGESTION_RECONCILE_MAX_DELETE_RATIO: ${INGESTION_RECONCILE_MAX_DELETE_RATIO:-0.5}
      INGESTION_RECONCILE_MAX_DELETES: ${INGESTION_RECONCILE_MAX_DELETES:-1000}
      INGESTION_RECONCILE_MAX_SEEN_IDS: ${INGESTION_RECONCILE_MAX_SEEN_IDS:-200000}
      INGESTION_RECONCILE_PAGE_SIZE: ${INGESTION_RECONCILE_PAGE_SIZE:-200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      alfresco:
        condition: service_healthy
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  # Alfresco live ingester (real-time event-driven sync via ActiveMQ)
  live-ingester:
    profiles: [alfresco, full, demo]
    image: content-lake-app/live-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/live-ingester/Dockerfile
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/aborroy/content-lake-app.git#main}"
    environment:
      ACTIVEMQ_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      ALFRESCO_EVENT_TOPIC: alfresco.repo.event2
      ALFRESCO_URL: http://alfresco:8080
      ALFRESCO_INTERNAL_USERNAME: ${ALFRESCO_ADMIN_USER}
      ALFRESCO_INTERNAL_PASSWORD: ${ALFRESCO_ADMIN_PASSWORD}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_TARGET_PATH}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      # Overridable so the ingester can be pointed at a markdown-capable engine (see the
      # transform-extras profile below) instead of the official plaintext-only AIO.
      TRANSFORM_URL: ${TRANSFORM_URL:-http://transform-core-aio:8090}
      TRANSFORM_TIMEOUT_MS: ${TRANSFORM_TIMEOUT_MS:-300000}
      # plaintext (default) keeps today's behaviour exactly. auto/markdown ask the engine for
      # text/markdown where it advertises it, so tables survive chunking as ChunkType.TABLE.
      EXTRACTION_FORMAT: ${EXTRACTION_FORMAT:-plaintext}
      # Extra extraction services tried before transform-core-aio, most structural first. Comma
      # separated; an entry may carry a backend-kind prefix (transform:, and others as they are added).
      # Empty means only the transform service above is used.
      EXTRACTION_ENGINE_URLS: ${EXTRACTION_ENGINE_URLS:-}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      LLM_MODEL: ${LLM_MODEL:-ai/gpt-oss}
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      alfresco:
        condition: service_healthy
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  # ── RAG service ─────────────────────────────────────────────────────────────

  rag-service:
    profiles: [alfresco, nuxeo, full, demo]
    image: content-lake-app/rag-service:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockerfiles/rag-service/Dockerfile
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/aborroy/content-lake-app.git#main}"
    environment:
      ALFRESCO_URL: http://alfresco:8080
      ALFRESCO_INTERNAL_USERNAME: ${ALFRESCO_ADMIN_USER}
      ALFRESCO_INTERNAL_PASSWORD: ${ALFRESCO_ADMIN_PASSWORD}
      NUXEO_URL: http://host.docker.internal:8081/nuxeo
      NUXEO_USERNAME: ${NUXEO_USERNAME:-Administrator}
      NUXEO_PASSWORD: ${NUXEO_PASSWORD:-Administrator}
      NUXEO_SOURCE_ID: ${NUXEO_SOURCE_ID:-local}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      RAG_PERMISSION_SOURCE_IDS: ${RAG_PERMISSION_SOURCE_IDS:-}
      # What happens when a caller's group membership cannot be read from a source repository.
      # fail-closed (the application default) drops that source from the permission filter; degrade
      # keeps the caller's own name plus GROUP_EVERYONE. Both log at WARN.
      RAG_SECURITY_GROUP_RESOLUTION_FAILURE: ${RAG_SECURITY_GROUP_RESOLUTION_FAILURE:-fail-closed}
      # Whether GROUP_ALFRESCO_ADMINISTRATORS reads an Alfresco source with no sys_racl condition at
      # all. The application default is off, so an administrator is ACL-filtered like anyone else.
      # This stack opts in: it is a demo where admin:admin is the working account, repository-admin
      # discoverability is part of what it shows, and the ACL suite asserts it. A deployment that
      # wants administrators subject to document ACLs sets this to false.
      RAG_SECURITY_ADMIN_BYPASS_ENABLED: ${RAG_SECURITY_ADMIN_BYPASS_ENABLED:-true}
      # Accounts allowed to read every submitter's feedback (GET /api/rag/feedback?scope=all). Everyone
      # else reads only their own ratings. The application default is empty; this stack names the two
      # repository admin accounts so `cleval feedback import`, which needs the whole corpus, works
      # against it. Clear it for a deployment where no one aggregates feedback.
      RAG_FEEDBACK_OPERATOR_USERS: ${RAG_FEEDBACK_OPERATOR_USERS:-admin,Administrator}
      # Multi-embedding-type retrieval. Empty by default, which leaves the vector leg on the single
      # wildcard call it has always made. List a retired model here during a migration and its
      # embedding type is queried in its own vector space, which is what stops recall dropping for
      # documents not yet moved onto the new model. Comma separated; coexisting types must share
      # vector dimensionality.
      RAG_EMBEDDING_ADDITIONAL_MODELS: ${RAG_EMBEDDING_ADDITIONAL_MODELS:-}
      RAG_EMBEDDING_TYPE_DISCOVERY_ENABLED: ${RAG_EMBEDDING_TYPE_DISCOVERY_ENABLED:-true}
      RAG_EMBEDDING_TYPE_DISCOVERY_TTL_SECONDS: ${RAG_EMBEDDING_TYPE_DISCOVERY_TTL_SECONDS:-300}
      # Re-embeds the corpus into the configured type at a controlled rate while the previous type
      # keeps answering queries. Off by default: it writes to every document and spends the embedding
      # throughput the ingesters need. The endpoints also require an account named below, so enabling
      # the flag alone does not open them.
      RAG_EMBEDDING_BACKFILL_ENABLED: ${RAG_EMBEDDING_BACKFILL_ENABLED:-false}
      RAG_EMBEDDING_BACKFILL_DOCS_PER_MINUTE: ${RAG_EMBEDDING_BACKFILL_DOCS_PER_MINUTE:-60}
      RAG_EMBEDDING_BACKFILL_OPERATOR_USERS: ${RAG_EMBEDDING_BACKFILL_OPERATOR_USERS:-admin,Administrator}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      LLM_MODEL: ${LLM_MODEL:-ai/qwen2.5}
      # Pinned to 0 so a generation delta is attributable to a change rather than to sampling
      # noise: at 0.3 the same question yields a different answer per run, and the tier-2 judge
      # metrics (faithfulness, answer_correctness, citation_accuracy) cannot form a stable
      # baseline. Overridable per environment for deployments that want more varied phrasing.
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      # The Spring AI OpenAI client defaults to a 10s total request timeout. Local Docker Model
      # Runner generations routinely take 8-15s, so the default intermittently times out with
      # "Total timeout 10000 ms elapsed" and RAG answers fail non-deterministically. Give
      # generation room (retrieval is unaffected).
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-15}
      RAG_DEFAULT_MIN_SCORE: ${RAG_DEFAULT_MIN_SCORE:-0.0}
      RAG_MAX_CONTEXT_LENGTH: ${RAG_MAX_CONTEXT_LENGTH:-12000}
      RAG_USE_HYBRID_SEARCH: ${RAG_USE_HYBRID_SEARCH:-true}
      # Persistent conversation summary (long-term memory), surfaced in the chat UI. On by default.
      RAG_CONVERSATION_SUMMARY_ENABLED: ${RAG_CONVERSATION_SUMMARY_ENABLED:-true}
      # Citation faithfulness check: populates `verified` / `unsupportedClaims` on prompt responses.
      # Off by default because it costs an extra generation call per answer.
      RAG_CITATION_VERIFY_ENABLED: ${RAG_CITATION_VERIFY_ENABLED:-false}
      SEMANTIC_SEARCH_MIN_SCORE: ${SEMANTIC_SEARCH_MIN_SCORE:-0.2}
      # Retrieval tunables. `environment` is an explicit mapping, so a variable absent from this
      # block never reaches the container however it is set on the host: the service silently keeps
      # its application.yml default. Every knob `content-lake-eval/config/sweeps/` varies must
      # therefore be listed here, or that sweep point measures the default and reports no change.
      # Fusion: weighted/minmax 50-50, measured as sprint 3 (content-lake-eval runs/sprint-3).
      # It beats the rrf default on every gated metric at once (recall@10 0.8143 -> 0.8286,
      # mrr 0.6760 -> 0.6830, ndcg@10 0.7021 -> 0.7083, hit_rate@10 0.8286 -> 0.8429) and lowers
      # latency (search p95 749 -> 628ms). RRF keeps only rank, so a document the vector leg ranked
      # 26th can enter a ten-slot pool on keyword rank alone; minmax keeps each leg's score margin,
      # so a deep-vector-rank document must be a strong keyword match in absolute terms to displace
      # a better one. Normalisation is what matters here, not the weights: max-50-50 was the worst
      # of the eight points swept and minmax-50-50 the best.
      SEARCH_HYBRID_STRATEGY: ${SEARCH_HYBRID_STRATEGY:-weighted}
      SEARCH_HYBRID_NORMALIZATION: ${SEARCH_HYBRID_NORMALIZATION:-minmax}
      SEARCH_HYBRID_VECTOR_WEIGHT: ${SEARCH_HYBRID_VECTOR_WEIGHT:-0.5}
      SEARCH_HYBRID_TEXT_WEIGHT: ${SEARCH_HYBRID_TEXT_WEIGHT:-0.5}
      # Only read when SEARCH_HYBRID_STRATEGY is rrf. Swept: k20 edges k60 on ranking, k120 is
      # identical to k60, and all three trail weighted/minmax.
      SEARCH_HYBRID_RRF_K: ${SEARCH_HYBRID_RRF_K:-60}
      SEARCH_HYBRID_INITIAL_CANDIDATES: ${SEARCH_HYBRID_INITIAL_CANDIDATES:-75}
      SEARCH_HYBRID_FINAL_RESULTS: ${SEARCH_HYBRID_FINAL_RESULTS:-20}
      # Keep at or near 0 on the hybrid path. Fused scores are on the fusion's own scale, not
      # cosine's: under rrf they span roughly 0.02-0.03, so a cosine-looking 0.1 discards every
      # result (measured: recall@10 0.0000, zero_result_rate 1.0000 at 0.1, 0.2 and 0.4).
      SEARCH_HYBRID_MIN_SCORE: ${SEARCH_HYBRID_MIN_SCORE:-0.01}
      RAG_MMR_ENABLED: ${RAG_MMR_ENABLED:-false}
      RAG_MMR_LAMBDA: ${RAG_MMR_LAMBDA:-0.5}
      RAG_MMR_POOL_SIZE: ${RAG_MMR_POOL_SIZE:-30}
      # Query expansion (sprint 2). Off by default, and the reason is latency, not quality: every
      # technique measured beats the control on all four gated retrieval metrics, but each adds one LLM
      # rewrite call plus an embedding and hxpr round trip per variant, and on a local Docker Model
      # Runner that call dominates. Measured on the eval-005 corpus (78 questions, 41 docs), against
      # off = recall@10 0.8286 / mrr 0.6830 / ndcg@10 0.7083 / hit_rate@10 0.8429, search p50 423ms:
      #
      #   multi-query 2 variants   recall 0.8643  mrr 0.7217  ndcg 0.7477  hit 0.8857  p50 4083ms
      #   multi-query 3 variants   recall 0.8500  mrr 0.7307  ndcg 0.7445  hit 0.8857  p50 4818ms
      #   multi-query 3 + rrf-k 20 recall 0.8500  mrr 0.7479  ndcg 0.7544  hit 0.8857  p50 4806ms
      #   multi-query 5 variants   recall 0.8571  mrr 0.7100  ndcg 0.7360  hit 0.8857  p50 6387ms
      #   HyDE 1000 chars          recall 0.8429  mrr 0.6879  ndcg 0.7184  hit 0.8571  p50 3581ms
      #   HyDE 400 chars           recall 0.8429  mrr 0.6950  ndcg 0.7236  hit 0.8571  p50 3516ms
      #   HyDE + multi-query 3     recall 0.8500  mrr 0.7216  ndcg 0.7382  hit 0.8857  p50 8551ms
      #
      # So multi-query is the technique that earns its place, ~11x search latency is the price, and the
      # exact variant count is within noise on 78 questions. HyDE on top of multi-query costs latency
      # and slightly LOWERS mrr/ndcg versus multi-query alone, so the two do not compose.
      # keyword_leg_hit_rate held at 1.0000 and zero_result_rate at 0.0000 on every point.
      #
      # RAG_QUERY_EXPANSION_MAX_VARIANTS caps the total, counting the original query, however many
      # techniques are on. RAG_QUERY_EXPANSION_RRF_K fuses across variants and is distinct from
      # SEARCH_HYBRID_RRF_K, which fuses the vector and keyword legs of one variant.
      RAG_QUERY_EXPANSION_MAX_VARIANTS: ${RAG_QUERY_EXPANSION_MAX_VARIANTS:-6}
      RAG_QUERY_EXPANSION_RRF_K: ${RAG_QUERY_EXPANSION_RRF_K:-60}
      RAG_MULTI_QUERY_ENABLED: ${RAG_MULTI_QUERY_ENABLED:-false}
      RAG_MULTI_QUERY_VARIANTS: ${RAG_MULTI_QUERY_VARIANTS:-3}
      RAG_HYDE_ENABLED: ${RAG_HYDE_ENABLED:-false}
      RAG_HYDE_MAX_CHARS: ${RAG_HYDE_MAX_CHARS:-1000}
      # Decomposition is the one technique the sweep argues AGAINST at tier 0: recall@10 stays flat at
      # 0.8286 while mrr falls 0.6830 -> 0.6477 and ndcg@10 0.7083 -> 0.6853, at both max-2 and max-4.
      # Sub-questions dilute the ranking without surfacing evidence the original query missed. Its real
      # target is tier-2 completeness (0.5766), which tier 0 cannot see, so this is "unproven", not
      # "useless" -- but it does not go on by default on a ranking regression.
      RAG_QUERY_DECOMPOSITION_ENABLED: ${RAG_QUERY_DECOMPOSITION_ENABLED:-false}
      RAG_QUERY_DECOMPOSITION_MAX_SUB_QUESTIONS: ${RAG_QUERY_DECOMPOSITION_MAX_SUB_QUESTIONS:-4}
      # Verbatim matching for identifier-like queries. An extra pass restricted to chunks holding the
      # identifier literally, added only when the query names one. Distinct from expansion: the problem
      # with a short alphanumeric token is that it is rare, not that the query is ambiguous, which is why
      # rewording it does not help. Off by default until the identifier sweep confirms the gain.
      RAG_VERBATIM_IDENTIFIER_ENABLED: ${RAG_VERBATIM_IDENTIFIER_ENABLED:-false}
      RAG_VERBATIM_IDENTIFIER_MIN_LENGTH: ${RAG_VERBATIM_IDENTIFIER_MIN_LENGTH:-3}
      RAG_VERBATIM_IDENTIFIER_MAX_TERMS: ${RAG_VERBATIM_IDENTIFIER_MAX_TERMS:-2}
      # Self-RAG gate. RAG_RETRIEVAL_GRADING_MIN_SCORE is on the fusion's own scale, not cosine's:
      # under the committed weighted/minmax strategy hit scores span 0-1, but under rrf they span
      # roughly 0.02-0.03, so a threshold carried over from one strategy discards everything under the
      # other. 0.0 leaves the gate inert even when enabled, which is the safe default.
      RAG_RETRIEVAL_GRADING_ENABLED: ${RAG_RETRIEVAL_GRADING_ENABLED:-false}
      RAG_RETRIEVAL_GRADING_MIN_SCORE: ${RAG_RETRIEVAL_GRADING_MIN_SCORE:-0.0}
      RAG_RETRIEVAL_GRADING_MIN_HITS: ${RAG_RETRIEVAL_GRADING_MIN_HITS:-1}
      RAG_RETRIEVAL_GRADING_BROADEN: ${RAG_RETRIEVAL_GRADING_BROADEN:-true}
      # Reranker: disabled by default (local/Docker Model Runner). To enable with compose.ai.yaml,
      # set RAG_RERANKER_URL=http://host.docker.internal:12435 in the environment or .env file.
      RAG_RERANKER_URL: ${RAG_RERANKER_URL:-}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_TOP_N: ${RAG_RERANKER_TOP_N:-8}
      RAG_SOURCE_LINKS_ALFRESCO_TEMPLATE: "/aca/#/search/(viewer:view/{nodeId})?location=%2Frag"
      RAG_SOURCE_LINKS_NUXEO_TEMPLATE: "/nuxeo/ui/#!/browse{nuxeoPath}"
      # Tracing (#73) and span payloads (#116). A blank endpoint means "create spans, export nothing",
      # which is the application default; with --profile observability, point it at the bundled
      # collector: http://otel-lgtm:4318/v1/traces
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-}
      # The only sampling knob. Listed here because environment is an explicit mapping: without this
      # line the variable never reaches the container, so the knob is configurable in the application
      # and not on the stack.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
      # Attaches chunk ids, scores, counts and token usage to the RAG spans. Off by default.
      RAG_OBSERVABILITY_PAYLOADS_ENABLED: ${RAG_OBSERVABILITY_PAYLOADS_ENABLED:-false}
      # ALSO copies the question, the retrieved chunk text, source names and paths, and the answer into
      # the trace backend. That is ACL-protected content leaving the service, and the backend's readers
      # are whoever can reach it rather than the ACL that governed the retrieval. Off by default; read
      # docs/security-model.md before turning it on.
      RAG_OBSERVABILITY_CAPTURE_CONTENT: ${RAG_OBSERVABILITY_CAPTURE_CONTENT:-false}
      RAG_OBSERVABILITY_MAX_CHUNKS_RECORDED: ${RAG_OBSERVABILITY_MAX_CHUNKS_RECORDED:-20}
      RAG_OBSERVABILITY_MAX_CONTENT_CHARS: ${RAG_OBSERVABILITY_MAX_CONTENT_CHARS:-2000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  # ── Nuxeo ingesters ─────────────────────────────────────────────────────────
  # Requires the Nuxeo server running separately:
  #   docker compose -f ../nuxeo-deployment/compose.yaml up -d

  nuxeo-batch-ingester:
    profiles: [nuxeo, full, demo]
    image: content-lake-app/nuxeo-batch-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/nuxeo-batch-ingester/Dockerfile
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/aborroy/content-lake-app.git#main}"
    environment:
      NUXEO_URL: http://host.docker.internal:8081/nuxeo
      NUXEO_USERNAME: ${NUXEO_USERNAME:-Administrator}
      NUXEO_PASSWORD: ${NUXEO_PASSWORD:-Administrator}
      NUXEO_SOURCE_ID: ${NUXEO_SOURCE_ID:-local}
      NUXEO_INCLUDED_ROOT_1: ${NUXEO_INCLUDED_ROOT_1:-/default-domain/workspaces}
      NUXEO_DISCOVERY_MODE: ${NUXEO_DISCOVERY_MODE:-CHILDREN}
      # No repository transform service backs this source, so extraction is in-process Tika
      # unless an engine is configured. Empty = unchanged behaviour. Point it at the
      # transform-extras profile for markdown extraction, e.g.
      #   transform:http://transform-convert2md:8090,transform:http://transform-liteparse:8090
      # which gives PDF tables from convert2md and spreadsheet tables from liteparse.
      EXTRACTION_ENGINE_URLS: ${EXTRACTION_ENGINE_URLS:-}
      EXTRACTION_ENGINE_TIMEOUT_MS: ${EXTRACTION_ENGINE_TIMEOUT_MS:-300000}
      EXTRACTION_FORMAT: ${EXTRACTION_FORMAT:-plaintext}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_NUXEO_TARGET_PATH:-/nuxeo-sync}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      LLM_MODEL: ${LLM_MODEL:-ai/gpt-oss}
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
      # Post-discovery reconciliation sweep. Application default is false; this stack opts in for the
      # end-to-end delete-while-live-ingester-down case, with the ratio raised for a small corpus.
      NUXEO_BATCH_RECONCILE_ENABLED: ${NUXEO_BATCH_RECONCILE_ENABLED:-true}
      NUXEO_BATCH_RECONCILE_MAX_DELETE_RATIO: ${NUXEO_BATCH_RECONCILE_MAX_DELETE_RATIO:-0.5}
      NUXEO_BATCH_RECONCILE_MAX_DELETES: ${NUXEO_BATCH_RECONCILE_MAX_DELETES:-1000}
      NUXEO_BATCH_RECONCILE_MAX_SEEN_IDS: ${NUXEO_BATCH_RECONCILE_MAX_SEEN_IDS:-200000}
      NUXEO_BATCH_RECONCILE_PAGE_SIZE: ${NUXEO_BATCH_RECONCILE_PAGE_SIZE:-200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  filesystem-batch-ingester:
    # Opt-in profile only: combine with a base stack that provides hxpr, e.g.
    #   docker compose --profile alfresco --profile filesystem up -d
    # Kept out of full/demo so those (which build from the default GitHub context) are unaffected
    # until this module is on the default branch.
    profiles: [filesystem]
    image: content-lake-app/filesystem-batch-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/filesystem-batch-ingester/Dockerfile
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/aborroy/content-lake-app.git#main}"
    environment:
      FILESYSTEM_ROOT_PATH: ${FILESYSTEM_ROOT_PATH:-/data/filesystem}
      FILESYSTEM_SOURCE_ID: ${FILESYSTEM_SOURCE_ID:-filesystem}
      # Empty = ingest all files; set e.g. "pdf,docx,txt,md,html" to restrict.
      FILESYSTEM_INCLUDE_EXTENSIONS: ${FILESYSTEM_INCLUDE_EXTENSIONS:-}
      # No repository transform service backs this source, so extraction is in-process Tika
      # unless an engine is configured. Empty = unchanged behaviour. Point it at the
      # transform-extras profile for markdown extraction, e.g.
      #   transform:http://transform-convert2md:8090,transform:http://transform-liteparse:8090
      # which gives PDF tables from convert2md and spreadsheet tables from liteparse.
      EXTRACTION_ENGINE_URLS: ${EXTRACTION_ENGINE_URLS:-}
      EXTRACTION_ENGINE_TIMEOUT_MS: ${EXTRACTION_ENGINE_TIMEOUT_MS:-300000}
      EXTRACTION_FORMAT: ${EXTRACTION_FORMAT:-plaintext}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_FILESYSTEM_TARGET_PATH:-/filesystem-sync}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      # Guards this ingester's own sync API. A filesystem source has no user directory, so the
      # service authenticates against one configured account. No compose default: the container
      # refuses to start without both, rather than shipping a known credential.
      FILESYSTEM_SYNC_USERNAME: ${FILESYSTEM_SYNC_USERNAME}
      FILESYSTEM_SYNC_PASSWORD: ${FILESYSTEM_SYNC_PASSWORD}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
      # Post-discovery reconciliation sweep. This source has no live ingester, so a batch sync is the
      # only path that writes and this sweep is the only path that ever deletes: without it, a file
      # removed from the mounted directory stays searchable forever.
      FILESYSTEM_BATCH_RECONCILE_ENABLED: ${FILESYSTEM_BATCH_RECONCILE_ENABLED:-true}
      FILESYSTEM_BATCH_RECONCILE_MAX_DELETE_RATIO: ${FILESYSTEM_BATCH_RECONCILE_MAX_DELETE_RATIO:-0.5}
      FILESYSTEM_BATCH_RECONCILE_MAX_DELETES: ${FILESYSTEM_BATCH_RECONCILE_MAX_DELETES:-1000}
      FILESYSTEM_BATCH_RECONCILE_MAX_SEEN_IDS: ${FILESYSTEM_BATCH_RECONCILE_MAX_SEEN_IDS:-200000}
      FILESYSTEM_BATCH_RECONCILE_PAGE_SIZE: ${FILESYSTEM_BATCH_RECONCILE_PAGE_SIZE:-200}
    volumes:
      # Mount the host directory to ingest (read-only). Override with FILESYSTEM_HOST_PATH.
      - "${FILESYSTEM_HOST_PATH:-./filesystem-data}:/data/filesystem:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  nuxeo-live-ingester:
    profiles: [nuxeo, full, demo]
    image: content-lake-app/nuxeo-live-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/nuxeo-live-ingester/Dockerfile
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/aborroy/content-lake-app.git#main}"
    environment:
      NUXEO_URL: http://host.docker.internal:8081/nuxeo
      NUXEO_USERNAME: ${NUXEO_USERNAME:-Administrator}
      NUXEO_PASSWORD: ${NUXEO_PASSWORD:-Administrator}
      NUXEO_SOURCE_ID: ${NUXEO_SOURCE_ID:-local}
      NUXEO_LIVE_AUDIT_ENABLED: ${NUXEO_LIVE_AUDIT_ENABLED:-true}
      NUXEO_LIVE_AUDIT_CURSOR_FILE: ${NUXEO_LIVE_AUDIT_CURSOR_FILE:-/data/audit-cursor.json}
      NUXEO_INCLUDED_ROOT_1: ${NUXEO_INCLUDED_ROOT_1:-/default-domain/workspaces}
      # No repository transform service backs this source, so extraction is in-process Tika
      # unless an engine is configured. Empty = unchanged behaviour. Point it at the
      # transform-extras profile for markdown extraction, e.g.
      #   transform:http://transform-convert2md:8090,transform:http://transform-liteparse:8090
      # which gives PDF tables from convert2md and spreadsheet tables from liteparse.
      EXTRACTION_ENGINE_URLS: ${EXTRACTION_ENGINE_URLS:-}
      EXTRACTION_ENGINE_TIMEOUT_MS: ${EXTRACTION_ENGINE_TIMEOUT_MS:-300000}
      EXTRACTION_FORMAT: ${EXTRACTION_FORMAT:-plaintext}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_NUXEO_TARGET_PATH:-/nuxeo-sync}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      LLM_MODEL: ${LLM_MODEL:-ai/gpt-oss}
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nuxeo-live-audit-data:/data
    depends_on:
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  # ── Transform engines (opt-in) ──────────────────────────────────────────────
  #
  # Structure-aware text extraction. The official transform-core-aio produces text/plain only, so a
  # table arrives as an undelimited run of text and is chunked as prose; liteparse produces
  # text/markdown for PDF and Office formats, which keeps headings and table rows intact so chunking
  # can segment on them and mark a table chunk as such.
  #
  # Strictly opt-in, on its own profile, and asserted so by `make verify-profiles`: every base profile
  # behaves identically without it. Turn it on with, for example:
  #
  #   EXTRACTION_FORMAT=auto docker compose --profile alfresco --profile transform-extras up -d
  #
  # Content Lake talks the alfresco-transform-core /transform protocol to it directly rather than
  # through a repository, so the same engine serves the Alfresco, Nuxeo and filesystem connectors.
  # For Alfresco set TRANSFORM_URL; for Nuxeo and filesystem set EXTRACTION_ENGINE_URL. Either way
  # EXTRACTION_FORMAT must be auto or markdown, or the engine is still asked for text/plain.
  transform-liteparse:
    profiles: [transform-extras]
    # Pinned rather than :latest so a run is reproducible. liteparse is ~370 MB and needs about 1 GB
    # of heap for the LibreOffice conversions behind the Office formats; it needs no GPU, so it does
    # not interact with the AI inference stack on port 12434.
    #
    # 1.1.0 or newer is required for spreadsheets: earlier images reached a sheet through a page
    # render and silently dropped any column past the page width, and produced no markdown tables.
    image: angelborroy/alf-tengine-liteparse:${TRANSFORM_EXTRAS_TAG:-1.1.0}
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80
        -Dlogging.level.org.alfresco.transform=ERROR
      # Deliberately absent: TEST_ENDPOINT_ENABLED. The browser form at / (which POSTs to /test) is
      # disabled by default in alfresco-transform-core 5.4.1 and must stay disabled outside local
      # development, because it accepts and transforms arbitrary uploads with no authentication.
    # No `ports:` mapping. The engine is reachable only inside the stack network, matching
    # transform-core-aio, which also publishes nothing. Never expose 8090 to the host.
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      # Generous start_period: the first call after a container start pays one-off initialisation, and
      # a cold start read as a hang leads to the engine being blamed for a timeout it did not cause.
      retries: 10
      start_period: 60s
    networks:
      - stack

  # Docling-based PDF to Markdown. Unlike liteparse this recovers real markdown tables, which is what
  # ChunkType.TABLE detection needs; measured on a 2-page fixture, its markdown separator-row count
  # matched the source table count exactly, with every column and value preserved.
  #
  # The cost is latency, and it is large: ~20.5s per 2-page PDF warm, against ~0.3-0.65s for liteparse,
  # roughly 65x. Memory is not the differentiator (~310 MB in use, less than liteparse). So this is the
  # engine to point at a table-heavy corpus where the ingest time is acceptable, not a general default.
  #
  # PDF only -- it advertises no DOCX, XLSX or PPTX transform. Route Office formats to liteparse.
  #
  #   EXTRACTION_FORMAT=auto TRANSFORM_URL=http://transform-convert2md:8090 \
  #     docker compose --profile alfresco --profile transform-extras up -d
  transform-convert2md:
    profiles: [transform-extras]
    # A real released tag exists for this engine, so there is no reason to track :latest.
    image: angelborroy/alf-tengine-convert2md:${TRANSFORM_CONVERT2MD_TAG:-1.1.0}
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80
        -Dlogging.level.org.alfresco.transform=ERROR
      # TEST_ENDPOINT_ENABLED deliberately absent, as for liteparse.
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      # Docling loads a layout model, so first readiness is slow. Give it room: a cold start read as a
      # hang gets the engine blamed for a timeout it did not cause.
      retries: 20
      start_period: 120s
    networks:
      - stack
