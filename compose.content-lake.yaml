# compose.content-lake.yaml — Content Lake ingestion and RAG services
# Part of the content-lake-app stack; loaded via include: in compose.yaml.
# Profiles: alfresco, full, demo (Alfresco ingesters + live ingester); nuxeo, full, demo (Nuxeo ingesters + live ingester);
#           all profiles (rag-service)
#
# Build approach: each service uses a local Dockerfile in dockerfiles/<service>/ that pulls
# app source via additional_context "code" (CONTENT_LAKE_GIT_CONTEXT -- remote Git URL or
# local ../content-lake-app path). This eliminates duplicate dockerfile_inline blocks while
# keeping the remote-source build capability.

services:

  # ── Alfresco ingesters ──────────────────────────────────────────────────────

  batch-ingester:
    profiles: [alfresco, full, demo]
    image: content-lake-app/batch-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/batch-ingester/Dockerfile
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/aborroy/content-lake-app.git#main}"
    environment:
      ACTIVEMQ_URL: ${CONTENT_LAKE_PERMISSION_SYNC_BROKER_URL:-tcp://activemq:61616}
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      ALFRESCO_URL: http://alfresco:8080
      ALFRESCO_INTERNAL_USERNAME: ${ALFRESCO_ADMIN_USER}
      ALFRESCO_INTERNAL_PASSWORD: ${ALFRESCO_ADMIN_PASSWORD}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_TARGET_PATH}
      HXPR_IDP_TOKEN_URL: http://idp:8080/idp/connect/token
      HXPR_IDP_CLIENT_ID: ${HXPR_IDP_CLIENT_ID}
      HXPR_IDP_CLIENT_SECRET: ${HXPR_IDP_CLIENT_SECRET}
      HXPR_IDP_USERNAME: ${HXPR_IDP_USERNAME}
      HXPR_IDP_PASSWORD: ${HXPR_IDP_PASSWORD}
      CONTENT_LAKE_PERMISSION_SYNC_QUEUE_NAME: ${CONTENT_LAKE_PERMISSION_SYNC_QUEUE_NAME:-contentlake.acl.changed}
      TRANSFORM_URL: http://transform-core-aio:8090
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      INGESTION_FOLDER_1: ${INGESTION_FOLDER_1:--root-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      alfresco:
        condition: service_healthy
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  # Alfresco live ingester (real-time event-driven sync via ActiveMQ)
  live-ingester:
    profiles: [alfresco, full, demo]
    image: content-lake-app/live-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/live-ingester/Dockerfile
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/aborroy/content-lake-app.git#main}"
    environment:
      ACTIVEMQ_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      ALFRESCO_EVENT_TOPIC: alfresco.repo.event2
      ALFRESCO_URL: http://alfresco:8080
      ALFRESCO_INTERNAL_USERNAME: ${ALFRESCO_ADMIN_USER}
      ALFRESCO_INTERNAL_PASSWORD: ${ALFRESCO_ADMIN_PASSWORD}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_TARGET_PATH}
      HXPR_IDP_TOKEN_URL: http://idp:8080/idp/connect/token
      HXPR_IDP_CLIENT_ID: ${HXPR_IDP_CLIENT_ID}
      HXPR_IDP_CLIENT_SECRET: ${HXPR_IDP_CLIENT_SECRET}
      HXPR_IDP_USERNAME: ${HXPR_IDP_USERNAME}
      HXPR_IDP_PASSWORD: ${HXPR_IDP_PASSWORD}
      TRANSFORM_URL: http://transform-core-aio:8090
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      alfresco:
        condition: service_healthy
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  # ── RAG service ─────────────────────────────────────────────────────────────

  rag-service:
    profiles: [alfresco, nuxeo, full, demo]
    image: content-lake-app/rag-service:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockerfiles/rag-service/Dockerfile
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/aborroy/content-lake-app.git#main}"
    environment:
      ALFRESCO_URL: http://alfresco:8080
      ALFRESCO_INTERNAL_USERNAME: ${ALFRESCO_ADMIN_USER}
      ALFRESCO_INTERNAL_PASSWORD: ${ALFRESCO_ADMIN_PASSWORD}
      NUXEO_URL: http://host.docker.internal:8081/nuxeo
      NUXEO_USERNAME: ${NUXEO_USERNAME:-Administrator}
      NUXEO_PASSWORD: ${NUXEO_PASSWORD:-Administrator}
      NUXEO_SOURCE_ID: ${NUXEO_SOURCE_ID:-local}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      RAG_PERMISSION_SOURCE_IDS: ${RAG_PERMISSION_SOURCE_IDS:-}
      HXPR_IDP_TOKEN_URL: http://idp:8080/idp/connect/token
      HXPR_IDP_CLIENT_ID: ${HXPR_IDP_CLIENT_ID}
      HXPR_IDP_CLIENT_SECRET: ${HXPR_IDP_CLIENT_SECRET}
      HXPR_IDP_USERNAME: ${HXPR_IDP_USERNAME}
      HXPR_IDP_PASSWORD: ${HXPR_IDP_PASSWORD}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      LLM_MODEL: ${LLM_MODEL:-ai/qwen2.5}
      LLM_TEMPERATURE: "0.3"
      LLM_MAX_TOKENS: "1024"
      # The Spring AI OpenAI client defaults to a 10s total request timeout. Local Docker Model
      # Runner generations routinely take 8-15s, so the default intermittently times out with
      # "Total timeout 10000 ms elapsed" and RAG answers fail non-deterministically. Give
      # generation room (retrieval is unaffected).
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-15}
      RAG_DEFAULT_MIN_SCORE: ${RAG_DEFAULT_MIN_SCORE:-0.0}
      RAG_MAX_CONTEXT_LENGTH: ${RAG_MAX_CONTEXT_LENGTH:-12000}
      RAG_USE_HYBRID_SEARCH: ${RAG_USE_HYBRID_SEARCH:-true}
      SEMANTIC_SEARCH_MIN_SCORE: ${SEMANTIC_SEARCH_MIN_SCORE:-0.2}
      # Reranker: disabled by default (local/Docker Model Runner). To enable with compose.ai.yaml,
      # set RAG_RERANKER_URL=http://host.docker.internal:12435 in the environment or .env file.
      RAG_RERANKER_URL: ${RAG_RERANKER_URL:-}
      RAG_SOURCE_LINKS_ALFRESCO_TEMPLATE: "/aca/#/search/(viewer:view/{nodeId})?location=%2Frag"
      RAG_SOURCE_LINKS_NUXEO_TEMPLATE: "/nuxeo/ui/#!/browse{nuxeoPath}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  # ── Nuxeo ingesters ─────────────────────────────────────────────────────────
  # Requires the Nuxeo server running separately:
  #   docker compose -f ../nuxeo-deployment/compose.yaml up -d

  nuxeo-batch-ingester:
    profiles: [nuxeo, full, demo]
    image: content-lake-app/nuxeo-batch-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/nuxeo-batch-ingester/Dockerfile
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/aborroy/content-lake-app.git#main}"
    environment:
      NUXEO_URL: http://host.docker.internal:8081/nuxeo
      NUXEO_USERNAME: ${NUXEO_USERNAME:-Administrator}
      NUXEO_PASSWORD: ${NUXEO_PASSWORD:-Administrator}
      NUXEO_SOURCE_ID: ${NUXEO_SOURCE_ID:-local}
      NUXEO_INCLUDED_ROOT_1: ${NUXEO_INCLUDED_ROOT_1:-/default-domain/workspaces}
      NUXEO_DISCOVERY_MODE: ${NUXEO_DISCOVERY_MODE:-CHILDREN}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_NUXEO_TARGET_PATH:-/nuxeo-sync}
      HXPR_IDP_TOKEN_URL: http://idp:8080/idp/connect/token
      HXPR_IDP_CLIENT_ID: ${HXPR_IDP_CLIENT_ID}
      HXPR_IDP_CLIENT_SECRET: ${HXPR_IDP_CLIENT_SECRET}
      HXPR_IDP_USERNAME: ${HXPR_IDP_USERNAME}
      HXPR_IDP_PASSWORD: ${HXPR_IDP_PASSWORD}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  nuxeo-live-ingester:
    profiles: [nuxeo, full, demo]
    image: content-lake-app/nuxeo-live-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/nuxeo-live-ingester/Dockerfile
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/aborroy/content-lake-app.git#main}"
    environment:
      NUXEO_URL: http://host.docker.internal:8081/nuxeo
      NUXEO_USERNAME: ${NUXEO_USERNAME:-Administrator}
      NUXEO_PASSWORD: ${NUXEO_PASSWORD:-Administrator}
      NUXEO_SOURCE_ID: ${NUXEO_SOURCE_ID:-local}
      NUXEO_LIVE_AUDIT_ENABLED: ${NUXEO_LIVE_AUDIT_ENABLED:-true}
      NUXEO_LIVE_AUDIT_CURSOR_FILE: ${NUXEO_LIVE_AUDIT_CURSOR_FILE:-/data/audit-cursor.json}
      NUXEO_INCLUDED_ROOT_1: ${NUXEO_INCLUDED_ROOT_1:-/default-domain/workspaces}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_NUXEO_TARGET_PATH:-/nuxeo-sync}
      HXPR_IDP_TOKEN_URL: http://idp:8080/idp/connect/token
      HXPR_IDP_CLIENT_ID: ${HXPR_IDP_CLIENT_ID}
      HXPR_IDP_CLIENT_SECRET: ${HXPR_IDP_CLIENT_SECRET}
      HXPR_IDP_USERNAME: ${HXPR_IDP_USERNAME}
      HXPR_IDP_PASSWORD: ${HXPR_IDP_PASSWORD}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nuxeo-live-audit-data:/data
    depends_on:
      hxpr-app:
        condition: service_healthy
    networks:
      - stack
