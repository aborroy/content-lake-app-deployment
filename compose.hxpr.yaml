# compose.hxpr.yaml - HXPR platform services
# Part of the content-lake-app stack; loaded via include: in compose.yaml.
# Profiles: alfresco, nuxeo, full, demo (opensearch-dashboards: debug)
#
# The hxpr community app needs MongoDB and OpenSearch only, matching the reference stack in
# Hyland/ai-ready-index (server/hxpr-community-internal-app/docker-compose.yml).

services:

  mongodb:
    profiles: [alfresco, nuxeo, full, demo]
    image: mongo:${MONGODB_TAG:-8.2.5}
    restart: unless-stopped
    hostname: mongo
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - stack

  opensearch:
    profiles: [alfresco, nuxeo, full, demo]
    image: opensearchproject/opensearch:${OPENSEARCH_TAG:-2.19.6}
    restart: unless-stopped
    hostname: opensearch
    environment:
      discovery.type: single-node
      cluster.routing.allocation.disk.threshold_enabled: "false"
      plugins.security.disabled: "true"
      # Required by the OpenSearch demo security installer that runs at startup,
      # even when security is subsequently disabled via plugins.security.disabled.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-Hyland_Pass1!}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - stack

  # Debugging UI for the OpenSearch cluster, opt-in and unauthenticated (the security plugin is
  # disabled), with read/write access to both the alfresco* and nuxeo_embeddings* indices. Not part
  # of any default stack: add --profile debug on top of a running stack to start it.
  opensearch-dashboards:
    profiles: [debug]
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_TAG:-2.19.6}
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    networks:
      - stack

  hxpr-app:
    profiles: [alfresco, nuxeo, full, demo]
    image: "${HXPR_LOCAL_IMAGE:-content-lake-app/hxpr-app:local}"
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./hxpr/Dockerfile
      args:
        HXPR_GIT_URL: ${HXPR_GIT_URL:-https://github.com/Hyland/ai-ready-index.git}
        HXPR_GIT_REF: ${HXPR_GIT_REF:-main}
        HXPR_GIT_SHA: ${HXPR_GIT_SHA:-}
      secrets:
        - source: hxpr_git_auth_token
          target: hxpr_git_auth_token
        - source: maven_username
          target: maven_username
        - source: maven_password
          target: maven_password
        - source: nexus_username
          target: nexus_username
        - source: nexus_password
          target: nexus_password
    environment:
      JAVA_OPTIONS: -Dnuxeo.mongodb.server=mongodb:27017
      NUXEO_MONGODB_SERVER: mongodb:27017
      OPENSEARCH_ADDRESSLIST: http://opensearch:9200
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - stack
