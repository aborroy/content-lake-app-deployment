name: content-lake-app

# ─── Shared infrastructure ────────────────────────────────────────────────────
networks:
  stack:
    driver: bridge

volumes:
  alf-repo-data:
  postgres-data:
  mongodb-data:
  opensearch-data:
  nuxeo-live-audit-data:
  # Writable state for a plugin connector on connector-batch-ingester (change cursors, delta tokens).
  # Only attached by the opt-in `connector` profile, so it is unused by every base deployment.
  connector-state-data:

# ─── Build secrets ────────────────────────────────────────────────────────────
secrets:
  hxpr_git_auth_token:
    environment: HXPR_GIT_AUTH_TOKEN
  maven_username:
    environment: MAVEN_USERNAME
  maven_password:
    environment: MAVEN_PASSWORD
  nexus_username:
    environment: NEXUS_USERNAME
  nexus_password:
    environment: NEXUS_PASSWORD

# ─── Compose modules ──────────────────────────────────────────────────────────
#
# Profiles:
#   alfresco  — Alfresco source (core services only)
#   nuxeo     — Nuxeo source only
#   full      — Alfresco + Nuxeo (core)
#   demo      — full + standalone demo UI at /
#
# Opt-in profiles, added on top of one of the above:
#   filesystem    - filesystem-batch-ingester
#   debug         - OpenSearch Dashboards on :5601
#   observability - trace backend for the RAG spans (Grafana on :3001); development only

include:
  - compose.alfresco.yaml
  - compose.hxpr.yaml
  - compose.content-lake.yaml
  - compose.ui.yaml
  - compose.observability.yaml
